---
- name: Runtime group 생성
  ansible.builtin.group:
    name: "{{ runtime_group }}"
    system: true
    state: present

- name: Runtime user 생성
  ansible.builtin.user:
    name: "{{ runtime_user }}"
    group: "{{ runtime_group }}"
    home: "{{ runtime_home }}"
    shell: /bin/bash
    system: true
    create_home: true
    state: present

- name: Runtime user SSH 디렉토리 생성
  ansible.builtin.file:
    path: "{{ runtime_home }}/.ssh"
    state: directory
    owner: "{{ runtime_user }}"
    group: "{{ runtime_group }}"
    mode: "0700"

- name: MiniPC runtime control public key 등록
  ansible.posix.authorized_key:
    user: "{{ runtime_user }}"
    key: "{{ item }}"
    state: present
    manage_dir: false
  loop: "{{ runtime_allowed_ssh_public_keys }}"
  no_log: true

- name: Runtime 기본 패키지 설치
  ansible.builtin.apt:
    name: "{{ runtime_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Docker 바이너리 존재 확인
  ansible.builtin.command:
    cmd: which docker
  register: runtime_docker_binary
  changed_when: false
  failed_when: false
  check_mode: false

- name: Docker 패키지 설치
  ansible.builtin.apt:
    name: "{{ runtime_docker_packages }}"
    state: present
  notify: Restart docker
  when: runtime_docker_binary.rc != 0

- name: Docker 서비스 활성화
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Libvirt/qemu 패키지 설치
  ansible.builtin.apt:
    name: "{{ runtime_libvirt_packages }}"
    state: present
  notify: Restart libvirtd

- name: Runtime Node inotify 한도 설정
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - name: fs.inotify.max_user_instances
      value: "{{ runtime_inotify_max_user_instances }}"
    - name: fs.inotify.max_user_watches
      value: "{{ runtime_inotify_max_user_watches }}"
  notify: Restart libvirtd

- name: Libvirtd 서비스 활성화
  ansible.builtin.service:
    name: libvirtd
    enabled: true
    state: started

- name: Libvirt 기본 VM 네트워크 상태 확인
  ansible.builtin.command:
    cmd: "virsh net-info {{ runtime_libvirt_network }}"
  register: runtime_libvirt_network_info
  changed_when: false

- name: Libvirt 기본 VM 네트워크 시작
  ansible.builtin.command:
    cmd: "virsh net-start {{ runtime_libvirt_network }}"
  changed_when: true
  when: >-
    'Active:          yes' not in runtime_libvirt_network_info.stdout and
    'Active:         yes' not in runtime_libvirt_network_info.stdout

- name: Libvirt 기본 VM 네트워크 자동 시작 상태 확인
  ansible.builtin.command:
    cmd: "virsh net-info {{ runtime_libvirt_network }}"
  register: runtime_libvirt_network_autostart_info
  changed_when: false

- name: Libvirt 기본 VM 네트워크 자동 시작 설정
  ansible.builtin.command:
    cmd: "virsh net-autostart {{ runtime_libvirt_network }}"
  changed_when: true
  when: >-
    'Autostart:      yes' not in runtime_libvirt_network_autostart_info.stdout and
    'Autostart:       yes' not in runtime_libvirt_network_autostart_info.stdout

- name: MiniPC에서 Runtime VM 네트워크 접근 허용
  ansible.builtin.iptables:
    chain: LIBVIRT_FWI
    source: "{{ item }}"
    destination: "{{ runtime_vm_network_cidr }}"
    out_interface: "{{ runtime_vm_network_bridge }}"
    jump: ACCEPT
    action: insert
    rule_num: "1"
    state: present
  loop: "{{ runtime_vm_forward_allowed_sources }}"
  when: runtime_vm_forward_allowed_sources | length > 0

- name: Runtime user를 libvirt 관련 그룹에 추가
  ansible.builtin.user:
    name: "{{ runtime_user }}"
    groups:
      - docker
      - libvirt
      - kvm
    append: true

- name: /var/lib/cka 디렉토리 구조 생성
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ runtime_user }}"
    group: "{{ runtime_libvirt_access_group }}"
    mode: "2770"
  loop: "{{ runtime_directories }}"

- name: Kind 바이너리 설치
  ansible.builtin.get_url:
    url: "{{ runtime_kind_url }}"
    dest: /usr/local/bin/kind
    mode: "0755"
    checksum: "{{ runtime_kind_checksum | default(omit, true) }}"

- name: Cloud-init 서비스 활성화
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
  loop:
    - cloud-init
    - cloud-config
    - cloud-final

- name: Runtime sudoers 정책 배치
  ansible.builtin.template:
    src: cka-runtime-sudoers.j2
    dest: /etc/sudoers.d/cka-runtime
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
