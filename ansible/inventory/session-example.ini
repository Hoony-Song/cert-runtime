[session_vms]
cka0001 ansible_host=192.168.122.10 vm_role=control-plane
cka0003 ansible_host=192.168.122.11 vm_role=worker

[session_vms:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=/var/lib/cka/sessions/cka-session-001/ssh/session_vm
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/var/lib/cka/sessions/cka-session-001/ssh/known_hosts'
ansible_become=true
session_id=cka-session-001
